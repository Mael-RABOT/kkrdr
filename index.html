<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#1a1511" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <script>
      // Apply the saved theme before first paint (same logic as src/theme.tsx).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          var bg = t === 'dark' ? '#1a1511' : '#faf6f0';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = bg; });
        }
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kkrdr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Log it. Compare it." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>kkrdr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
